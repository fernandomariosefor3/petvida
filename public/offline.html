<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>PetVida Care — Offline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0fdf4; color: #1f2937; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
    .box { max-width: 360px; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 0.9rem; }
    button { margin-top: 20px; padding: 10px 20px; border-radius: 10px; border: none; background: #10b981; color: white; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size: 48px; margin-bottom: 12px;">🐾</div>
    <h1>Você está offline</h1>
    <p>Verifique sua conexão com a internet. Assim que você reconectar, o PetVida volta ao normal.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
